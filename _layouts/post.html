<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Kardashev's Records</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        body { 
            font-family: "Pretendard Variable", sans-serif;
            line-height: 1.6; /* 행간을 1.6으로 축소 */
            color: #1a1a1a; /* 대비 향상 */
            max-width: 650px; /* 폰트 크기에 맞춰 가로폭 축소 */
            margin: 0 auto; 
            padding: 60px 25px; 
            word-break: keep-all;
            -webkit-font-smoothing: antialiased; /* 글자를 더 매끄럽게 표시 */
        }
        header { margin-bottom: 50px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        header a { text-decoration: none; color: #999; font-size: 14px; }
        h1 { font-size: 32px; font-weight: 700; margin-top: 20px; letter-spacing: -0.02em; }
        .post-meta { color: #999; font-size: 14px; margin-bottom: 30px; }
        .post-content { 
            font-size: 16px; /* 16px로 변경 */
            font-weight: 400; 
            margin-bottom: 30px; 
            text-align: justify; /* 좌우 꽉 채우기 유지 */
            text-justify: inter-character; 
            letter-spacing: -0.01em; /* 자간을 미세하게 좁혀 밀도감 상승 */
        }
        .social-share { margin-top: 50px; border-top: 1px solid #f0f0f0; padding-top: 20px; }
        .btn-x { background-color: #000; color: #fff; text-decoration: none; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; }
    </style>
</head>
<body>
    <header><a href="/">← Back to Home</a></header>
    <main>
        <h1>{{ page.title }}</h1>
        <div class="post-meta">{{ page.date | date: "%Y.%m.%d" }}</div>
        <div class="post-content">{{ content }}</div>
    </main>
    <div class="social-share">
        <a href="https://twitter.com/intent/tweet?text={{ page.title }}&url={{ site.url }}{{ page.url }}" target="_blank" class="btn-x">𝕏 Post</a>
    </div>
</body>
</html>
