<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kardashev3</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        body { 
                font-family: "Pretendard Variable", sans-serif;
                line-height: 1.6; /* 행간을 1.6으로 축소 */
                color: #1a1a1a; /* 대비 향상 */
                max-width: 650px; /* 폰트 크기에 맞춰 가로폭 축소 */
                margin: 0 auto; 
                padding: 60px 25px; 
                word-break: keep-all;
                -webkit-font-smoothing: antialiased; /* 글자를 더 매끄럽게 표시 */
            }
        header { margin-bottom: 60px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        header h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.03em; }
        article { margin-bottom: 120px; }
        .post-date { color: #999; font-size: 14px; margin-bottom: 8px; }
        article h2 { font-size: 24px; font-weight: 700; margin-top: 0; margin-bottom: 20px; letter-spacing: -0.02em; }
        article h2 a { text-decoration: none; color: #0044cc; }
        .post-content { 
                font-size: 16px; /* 16px로 변경 */
                font-weight: 400; 
                margin-bottom: 30px; 
                text-align: justify; /* 좌우 꽉 채우기 유지 */
                text-justify: inter-character; 
                letter-spacing: -0.01em; /* 자간을 미세하게 좁혀 밀도감 상승 */
            }
        .post-content img { max-width: 100%; height: auto; }
        .post-footer { display: flex; align-items: center; gap: 15px; padding-top: 15px; border-top: 1px solid #f4f4f4; }
        .btn-x { 
            background-color: #000; color: #fff; text-decoration: none; 
            padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-x:hover { opacity: 0.8; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 50px; }
        .pagination a, .pagination span { padding: 8px 14px; border: 1px solid #eee; text-decoration: none; color: #666; font-size: 14px; border-radius: 4px; }
        .pagination .active { font-weight: 700; border: 1px solid #333; color: #000; }
        /* 주석(Footnotes) 전체 영역 스타일 */
        .footnotes {
            font-size: 14px;      /* 본문 16px보다 작게 설정하여 보조 정보임을 명시 */
            color: #888;          /* 연한 회색으로 변경하여 시각적 무게감 감소 */
            line-height: 1.5;     /* 작은 폰트에 맞춰 행간도 미세하게 조정 */
            margin-top: 60px;     /* 본문과의 충분한 간격 확보 */
            padding-top: 20px;
            border-top: 1px solid #eee; /* 구분선 추가로 본문과 확실히 분리 */
        }
        
        /* 주석 목록(숫자) 스타일 */
        .footnotes ol {
            padding-left: 20px;
            margin: 0;
        }
        
        /* 주석 본문 내 링크 및 되돌아가기 화살표(↩) */
        .footnotes a {
            color: #666;
            text-decoration: underline;
            text-decoration-color: #ddd;
        }
        
        .footnotes a.reversefootnote {
            text-decoration: none;
            margin-left: 5px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <header>
        <h1><a href="/" style="text-decoration:none; color:#333;">Kardashev3</a></h1>
    </header>

    <main>
        {% for post in site.posts %}
        <article>
            <div class="post-date">{{ post.date | date: "%Y.%m.%d" }}</div>
            <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
            <div class="post-content">
                {{ post.content }}
            </div>
            <div class="post-footer">
                <a href="https://twitter.com/intent/tweet?text={{ post.title }}&url={{ site.url }}{{ post.url }}" target="_blank" class="btn-x">
                    𝕏 Post
                </a>
                <span style="color: #ccc; font-size: 13px;">Posted on {{ post.date | date: "%B %d, %Y" }}</span>
            </div>
        </article>
        {% endfor %}
    </main>

    <nav class="pagination">
        <span class="active">1</span>
    </nav>

    <footer style="margin-top: 100px; text-align: center; color: #bbb; font-size: 13px;">
        &copy; 2026 kardashev3.
    </footer>

    <div id="secret-editor" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.98); z-index:9999; padding:40px 20px; box-sizing:border-box; overflow-y:auto;">
        <div style="max-width:700px; margin:0 auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <h2 style="margin:0;">New Record</h2>
                <button onclick="closeEditor()" style="background:none; border:none; font-size:24px; cursor:pointer;">✕</button>
            </div>
            <details style="margin-bottom:20px; color:#666; font-size:14px;">
                <summary style="cursor:pointer;">Serverless Settings</summary>
                <input type="password" id="gh-token" placeholder="GitHub Access Token" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ddd; border-radius:4px;">
                <input type="text" id="gh-repo" value="kardashev3/kardashev3.github.io" style="width:100%; padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:4px;">
            </details>
            <input type="text" id="post-title" placeholder="Title" style="width:100%; padding:15px; font-size:24px; font-weight:700; border:none; border-bottom:2px solid #333; outline:none; margin-bottom:10px; background:transparent;">
            <input type="text" id="post-slug" placeholder="URL Slug (e.g., my-new-post)" style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #eee; border-radius: 4px; margin-bottom: 20px; outline:none; color: #666;">
            <textarea id="post-content" placeholder="Content (Markdown)" style="width:100%; height:450px; padding:15px; font-family:inherit; font-size:16px; line-height:1.6; border:1px solid #eee; border-radius:8px; resize:none; outline:none;"></textarea>
            <div style="text-align:right; margin-top:20px;">
                <button onclick="uploadPost()" id="upload-btn" style="background:#000; color:#fff; border:none; padding:12px 30px; border-radius:30px; font-size:16px; font-weight:bold; cursor:pointer;">Publish Now</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.shiftKey && (e.key === 'W' || e.key === 'w')) {
                document.getElementById('secret-editor').style.display = 'block';
                const savedToken = localStorage.getItem('gh_token');
                if(savedToken) document.getElementById('gh-token').value = savedToken;
            }
        });

        function closeEditor() { document.getElementById('secret-editor').style.display = 'none'; }
        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }

        async function uploadPost() {
            const token = document.getElementById('gh-token').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const title = document.getElementById('post-title').value.trim();
            const slugInput = document.getElementById('post-slug').value.trim();
            const content = document.getElementById('post-content').value;
            const btn = document.getElementById('upload-btn');

            if (!token || !title || !content) { alert('Title and Content are required.'); return; }

            btn.innerText = "Publishing...";
            btn.disabled = true;
            localStorage.setItem('gh_token', token);

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const timeStr = now.toTimeString().split(' ')[0];
            const localDateStr = `${year}-${month}-${day}`;
            
            const finalSlug = slugInput || title.replace(/\s+/g, '-').replace(/[^\w\-\uAC00-\uD7A3]/g, '').toLowerCase();
            const customPermalink = `/${year}/${month}/${day}/${finalSlug}/`;
            const path = `_posts/${localDateStr}-${finalSlug}.md`;

            const finalContent = `---\nlayout: post\ntitle: "${title}"\ndate: ${localDateStr} ${timeStr} +0900\npermalink: ${customPermalink}\n---\n\n${content}`;

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Post: ${title}`, content: utf8_to_b64(finalContent) })
                });

                if (response.ok) { alert('Success!'); location.reload(); } 
                else { const err = await response.json(); alert('Error: ' + err.message); btn.innerText = "Publish Now"; btn.disabled = false; }
            } catch (error) { alert('Error: ' + error); btn.innerText = "Publish Now"; btn.disabled = false; }
        }
    </script>
</body>
</html>
